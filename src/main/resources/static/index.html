<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Lab Balanceo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: #eef2f7; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #fff; width: 100%; max-width: 380px; padding: 32px; border-radius: 12px;
                box-shadow: 0 6px 24px rgba(0,0,0,.08); }
        h1 { font-size: 22px; margin-bottom: 4px; color: #1f2937; }
        .sub { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        label { display: block; font-size: 13px; color: #374151; margin: 12px 0 4px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: #2563eb; }
        button { width: 100%; margin-top: 20px; padding: 11px; border: none; border-radius: 8px;
                 background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .link { text-align: center; margin-top: 14px; font-size: 13px; }
        .link a { color: #2563eb; cursor: pointer; text-decoration: underline; }
        .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
        .error { color: #dc2626; }
        .ok { color: #16a34a; }
        .instancia { margin-top: 18px; padding: 8px; background: #f3f4f6; border-radius: 8px;
                     font-size: 12px; color: #4b5563; text-align: center; font-family: Consolas, monospace; }
        .oculto { display: none; }
    </style>
</head>
<body>
<div class="card">
    <h1 id="titulo">Iniciar sesión</h1>
    <p class="sub">Lab de balanceo de carga · TECSUP</p>

    <form id="formLogin">
        <label for="username">Usuario</label>
        <input id="username" required autocomplete="username">
        <label for="password">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password">
        <button type="submit">Ingresar</button>
        <p class="link">¿No tienes cuenta? <a id="irRegistro">Regístrate</a></p>
    </form>

    <form id="formRegistro" class="oculto">
        <label for="rNombre">Nombre completo</label>
        <input id="rNombre" required>
        <label for="rUsername">Usuario</label>
        <input id="rUsername" required minlength="3">
        <label for="rPassword">Contraseña (mínimo 6)</label>
        <input id="rPassword" type="password" required minlength="6">
        <button type="submit">Crear cuenta</button>
        <p class="link"><a id="irLogin">Volver al login</a></p>
    </form>

    <p id="msg" class="msg"></p>
    <div id="instancia" class="instancia">Servidor: —</div>
</div>

<script>
    const msg = document.getElementById('msg');
    const formLogin = document.getElementById('formLogin');
    const formRegistro = document.getElementById('formRegistro');

    if (localStorage.getItem('token')) location.href = 'productos.html';

    function mostrarInstancia(res) {
        const s = res.headers.get('X-Servido-Por');
        if (s) document.getElementById('instancia').textContent = 'Servidor: ' + s;
    }

    function mensaje(texto, tipo) {
        msg.textContent = texto;
        msg.className = 'msg ' + tipo;
    }

    document.getElementById('irRegistro').onclick = () => {
        formLogin.classList.add('oculto'); formRegistro.classList.remove('oculto');
        document.getElementById('titulo').textContent = 'Crear cuenta'; mensaje('', '');
    };
    document.getElementById('irLogin').onclick = () => {
        formRegistro.classList.add('oculto'); formLogin.classList.remove('oculto');
        document.getElementById('titulo').textContent = 'Iniciar sesión'; mensaje('', '');
    };

    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value
                })
            });
            mostrarInstancia(res);
            const data = await res.json();
            if (!res.ok) { mensaje(data.error || 'Error al iniciar sesión', 'error'); return; }
            localStorage.setItem('token', data.token);
            localStorage.setItem('nombre', data.nombre);
            location.href = 'productos.html';
        } catch (err) {
            mensaje('No se pudo conectar con el servidor', 'error');
        }
    });

    formRegistro.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: document.getElementById('rNombre').value.trim(),
                    username: document.getElementById('rUsername').value.trim(),
                    password: document.getElementById('rPassword').value
                })
            });
            mostrarInstancia(res);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { mensaje(data.error || 'Datos inválidos', 'error'); return; }
            formRegistro.reset();
            document.getElementById('irLogin').click();
            mensaje('Cuenta creada. Ahora inicia sesión.', 'ok');
        } catch (err) {
            mensaje('No se pudo conectar con el servidor', 'error');
        }
    });
</script>
</body>
</html>
