spring.application.name=lab-balanceo

# Puerto por defecto (se sobrescribe al arrancar: --server.port=8082, etc.)
server.port=8081

# ===== Base de datos =====
# En local usa los valores por defecto (XAMPP). En AWS se pasan por variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lab_balanceo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== JWT =====
# La MISMA clave en todas las instancias: asi un token emitido por el backend 1 es valido en el 2 y el 3.
app.jwt.secret=${JWT_SECRET:dGVjc3VwLWxhYi1iYWxhbmNlby1zZWNyZXRvLWp3dC0yMDI2LWNsYXZl}
app.jwt.expiration-ms=3600000

# ===== Actuator (health check para Nginx / ALB) =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
