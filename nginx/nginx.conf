worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Log que muestra a que backend se envio cada peticion (evidencia del balanceo)
    log_format balanceo '$remote_addr [$time_local] "$request" $status -> $upstream_addr';
    access_log  logs/access.log  balanceo;

    # ===== Grupo de backends (Round Robin es el algoritmo por defecto) =====
    upstream backend_pool {
        server 127.0.0.1:8081 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8082 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8083 max_fails=2 fail_timeout=10s;
    }

    server {
        listen       80;
        server_name  localhost;

        location / {
            proxy_pass http://backend_pool;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Si un backend esta caido, Nginx reintenta con el siguiente
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 2s;

            # Cabecera extra: direccion del backend elegido por Nginx
            add_header X-Upstream $upstream_addr always;
        }
    }
}
